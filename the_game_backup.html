<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Neon Square</title>
    <meta name="description"
        content="Fast-paced neon cyberpunk platformer set in a dynamic sci-fi cityscape with stylized combat and wall jumps." />
    <meta property="og:title" content="Neon Square" />
    <meta property="og:description"
        content="Fast-paced neon cyberpunk platformer set in a dynamic sci-fi cityscape with stylized combat and wall jumps." />
    <style>
        /* --- RESET & LAYOUT --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: "Segoe UI", sans-serif;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            background: #000;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.1);
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            width: 100%;
            height: 100%;
            background: #0a0a10;
            cursor: none;
            z-index: 0;
        }

        /* UI HUD */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 220px;
            height: auto;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
        }

        .ui-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
        }

        .label {
            color: #fff;
            margin-right: 10px;
            min-width: 70px;
        }

        .hp-container {
            flex-grow: 1;
            height: 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #hp-fill {
            height: 100%;
            width: 100%;
            background-color: #ffff00;
            transition: width 0.1s linear, background-color 0.2s;
        }

        .weapon-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            width: 100%;
        }

        #weapon-name {
            font-size: 10px;
            color: #aaa;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cd-container {
            width: 100px;
            height: 6px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #cd-fill {
            height: 100%;
            width: 100%;
            background-color: #00f3ff;
            transition: width 0.1s linear;
        }

        #shrine-cd-fill {
            height: 100%;
            width: 100%;
            background-color: #ff0055;
            transition: width 0.1s linear;
        }

        .pips-container {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .pip {
            position: relative;
            width: 18px;
            height: 10px;
            background-color: #20242e;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            transition: background-color 0.1s, box-shadow 0.1s, border-color 0.1s;
        }

        .pip.jump-active {
            background-color: #ffff00;
            border-color: #ffff00;
            box-shadow: 0 0 6px #ffff00;
        }

        .pip.dash-active {
            background-color: #00f3ff;
            border-color: #00f3ff;
            box-shadow: 0 0 7px #00f3ff;
        }

        .pip.dash-active .pip-fill {
            display: none;
        }

        .pip.dash-charging {
            background-color: #12151d;
            border-color: rgba(0, 243, 255, 0.4);
        }

        .pip-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background-color: #00f3ff;
            opacity: 0.85;
            transition: width 0.05s linear;
        }

        /* CINEMATIC & FADE */
        #cinematic-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #cinematic-layer.active {
            opacity: 1;
        }

        .cine-bar {
            width: 100%;
            height: 0;
            background-color: #000;
            transition: height 0.5s ease;
        }

        #cinematic-layer.active .cine-bar {
            height: 60px;
        }

        #dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #fff;
            padding: 20px;
            text-align: center;
            font-family: "Courier New", monospace;
            display: none;
        }

        #cinematic-layer.active #dialogue-box {
            display: block;
        }

        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        #fade-overlay.black {
            opacity: 1;
        }

        #wave-banner {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            font-family: "Segoe UI", sans-serif;
            font-size: 36px;
            font-weight: 900;
            color: #ff0055;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 15;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        #wave-banner.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }
    </style>
</head>

<body>
    <div id="game-container">
        <canvas id="game" width="800" height="450"></canvas>
        <div id="wave-banner">Wave 1</div>
        <div id="ui-layer">
            <div id="ui-panel">
                <div class="ui-row"><span class="label">HP</span>
                    <div class="hp-container">
                        <div id="hp-fill"></div>
                    </div>
                </div>
                <div class="ui-row"><span class="label">Wall Jumps</span>
                    <div id="jumps-container" class="pips-container"></div>
                </div>
                <div class="ui-row"><span class="label">Dashes</span>
                    <div id="dashes-container" class="pips-container"></div>
                </div>
                <div class="ui-row"><span class="label">Weapon</span>
                    <div class="weapon-info"><span id="weapon-name">Pellets</span>
                        <div class="cd-container">
                            <div id="cd-fill"></div>
                        </div>
                    </div>
                </div>
                <div class="ui-row"><span class="label">Shrine (G)</span>
                    <div class="weapon-info">
                        <div class="cd-container">
                            <div id="shrine-cd-fill"></div>
                        </div>
                    </div>
                </div>
                <div class="ui-divider" style="border-top: 1px solid rgba(255, 255, 255, 0.2); margin: 6px 0;"></div>
                <div class="ui-row"><span class="label">Enemy Count (M/N)</span><span id="enemy-count-val"
                        style="color: #00f3ff; font-family: monospace; font-size: 14px;">8</span></div>
                <div class="ui-row"><span class="label">Wave</span><span id="wave-val"
                        style="color: #ff0055; font-family: monospace; font-size: 14px;">Wave 1</span></div>
            </div>
        </div>
    </div>

    <script>
        // ================== CONFIGURATION ==================
        class Config {
            static PHYSICS = { GRAVITY: 0.6, RUN_SPEED: 4.0, ACCEL: 1.5, GROUND_FRICTION: 0.8, AIR_RESISTANCE: 0.97, WALL_SLIDE_SPEED: 2, TERMINAL_VELOCITY: 18, DASH_SPEED: 18.0, DASH_DURATION: 10, DASH_REGEN_TIME: 30, JUMP_POWER: -13, JUMP_CUTOFF: 0.5, ENTITY_REPULSION: 1.5 };
            static WORLD = { WIDTH: 2000, HEIGHT: 1200 };
            static COLORS = { BG: "#040408", PLAYER: "#FFFF00", PLAYER_EYES: "#000000", ENEMY: "#ff0055", ENEMY_DEAD: "#800080", ENEMY_EYES: "#330000", WALL: "#12141c", WALL_GLOW: "rgba(0, 0, 0, 0)", DASH_ACTIVE: "#00f3ff", ENEMY_DASH: "#ff5500" };
        }

        // ================== UTILITIES ==================
        class Utils {
            static rand(min, max) { return Math.random() * (max - min) + min; }
            static lerp(start, end, amt) { return (1 - amt) * start + amt * end; }
            static checkAABB(rect1, rect2) { return (rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x && rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y); }
            static getAngle(x1, y1, x2, y2) { return Math.atan2(y2 - y1, x2 - x1); }
            static dist(x1, y1, x2, y2) { return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2)); }
            static lineIntersectsRect(p1, p2, rect) {
                if (p1.x > rect.x && p1.x < rect.x + rect.width && p1.y > rect.y && p1.y < rect.y + rect.height) return true;
                if (p2.x > rect.x && p2.x < rect.x + rect.width && p2.y > rect.y && p2.y < rect.y + rect.height) return true;
                return false;
            }
        }

        // ================== CORE SYSTEMS ==================
        class InputHandler {
            constructor(canvas) {
                this.keys = {}; this.keysPressed = {};
                this.mouse = { x: 0, y: 0, down: false, pressed: false };
                this.canvas = canvas;
                window.addEventListener("keydown", (e) => this._onKeyDown(e));
                window.addEventListener("keyup", (e) => this._onKeyUp(e));
                canvas.addEventListener("mousemove", (e) => this._onMouseMove(e));
                canvas.addEventListener("mousedown", (e) => this._onMouseDown(e));
                canvas.addEventListener("mouseup", (e) => this._onMouseUp(e));
            }
            _onKeyDown(e) { const k = e.key.toLowerCase(); if (!this.keys[k]) this.keysPressed[k] = true; this.keys[k] = true; }
            _onKeyUp(e) { const k = e.key.toLowerCase(); this.keys[k] = false; this.keysPressed[k] = false; }
            _onMouseMove(e) { const r = this.canvas.getBoundingClientRect(); this.mouse.x = e.clientX - r.left; this.mouse.y = e.clientY - r.top; }
            _onMouseDown(e) { if (e.button === 0) { this.mouse.down = true; this.mouse.pressed = true; } }
            _onMouseUp(e) { if (e.button === 0) this.mouse.down = false; }
            isDown(key) { return !!this.keys[key]; }
            isPressed(key) { return !!this.keysPressed[key]; }
            clearFrame() { this.keysPressed = {}; this.mouse.pressed = false; }
        }

        class PhysicsSystem {
            constructor(level) { this.level = level; }
            applyGravity(entity) { entity.dy += Config.PHYSICS.GRAVITY; }
            applyFriction(entity) { const friction = entity.onGround ? Config.PHYSICS.GROUND_FRICTION : Config.PHYSICS.AIR_RESISTANCE; entity.dx *= friction; if (Math.abs(entity.dx) < 0.1) entity.dx = 0; }
            resolveCollisions(entity) {
                if (entity.onWall && entity.dy > 0 && !entity.onGround) entity.dy = Config.PHYSICS.WALL_SLIDE_SPEED;
                let nextX = entity.x + entity.dx; let nextY = entity.y + entity.dy;
                entity.onGround = false; entity.onWall = false;
                for (const plat of this.level.platforms) {
                    if (Utils.checkAABB({ x: nextX, y: entity.y, width: entity.width, height: entity.height }, plat)) {
                        if (entity.dx > 0) { nextX = plat.x - entity.width; entity.onWall = "right"; }
                        else if (entity.dx < 0) { nextX = plat.x + plat.width; entity.onWall = "left"; }
                        entity.dx = 0;
                    }
                }
                for (const plat of this.level.platforms) {
                    if (Utils.checkAABB({ x: nextX, y: nextY, width: entity.width, height: entity.height }, plat)) {
                        if (entity.dy > 0) { nextY = plat.y - entity.height; entity.onGround = true; }
                        else if (entity.dy < 0) { nextY = plat.y + plat.height; }
                        entity.dy = 0;
                    }
                }
                entity.x = nextX; entity.y = nextY;
                if (entity.x < 0) entity.x = 0;
                if (entity.x > Config.WORLD.WIDTH - entity.width) entity.x = Config.WORLD.WIDTH - entity.width;
            }
            resolveEntitySeparation(entities) {
                for (let i = 0; i < entities.length; i++) {
                    for (let j = i + 1; j < entities.length; j++) {
                        const e1 = entities[i]; const e2 = entities[j];
                        if (e1.isDead || e2.isDead) continue;
                        if (Utils.checkAABB(e1, e2)) {
                            const cx1 = e1.x + e1.width / 2; const cy1 = e1.y + e1.height / 2;
                            const cx2 = e2.x + e2.width / 2; const cy2 = e2.y + e2.height / 2;
                            let dx = cx1 - cx2; let dy = cy1 - cy2; let dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist === 0) { dx = 1; dy = 0; dist = 1; }
                            const nx = dx / dist; const ny = dy / dist; const force = Config.PHYSICS.ENTITY_REPULSION;
                            e1.dx += nx * force; e1.dy += ny * force; e2.dx -= nx * force; e2.dy -= ny * force;
                        }
                    }
                }
            }
        }

        class RenderSystem {
            constructor(ctx, camera) { this.ctx = ctx; this.camera = camera; }
            clear(width, height, hitstopActive = false) {
                this.ctx.fillStyle = hitstopActive ? "#a8b2b8" : Config.COLORS.BG;
                this.ctx.fillRect(0, 0, width, height);
            }
            begin() { this.ctx.save(); this.ctx.translate(-this.camera.x, -this.camera.y); }
            end() { this.ctx.restore(); }
            drawLevel(level, hitstopActive = false) {
                // 1. Fill solid platform mass (single merged path, completely seamless across all fused blocks)
                this.ctx.beginPath();
                for (const p of level.platforms) this.ctx.rect(p.x, p.y, p.width, p.height);
                this.ctx.fillStyle = hitstopActive ? "#000000" : "#11131a";
                this.ctx.fill();

                if (hitstopActive) {
                    // Hitstop mode: crisp white stroke along entire fused outer perimeter
                    this.ctx.strokeStyle = "#ffffff";
                    this.ctx.lineWidth = 1.5;
                    this.ctx.beginPath();
                    if (level.allOuterEdges) {
                        for (const e of level.allOuterEdges) {
                            this.ctx.moveTo(e.x1, e.y1);
                            this.ctx.lineTo(e.x2, e.y2);
                        }
                    }
                    this.ctx.stroke();
                } else {
                    // 2. Stroke all external non-top perimeter boundaries (bottom, left, right edges)
                    this.ctx.strokeStyle = "#252b3e";
                    this.ctx.lineWidth = 1.5;
                    this.ctx.beginPath();
                    if (level.bottomEdges) {
                        for (const e of level.bottomEdges) {
                            this.ctx.moveTo(e.x1, e.y);
                            this.ctx.lineTo(e.x2, e.y);
                        }
                    }
                    if (level.leftEdges) {
                        for (const e of level.leftEdges) {
                            this.ctx.moveTo(e.x, e.y1);
                            this.ctx.lineTo(e.x, e.y2);
                        }
                    }
                    if (level.rightEdges) {
                        for (const e of level.rightEdges) {
                            this.ctx.moveTo(e.x, e.y1);
                            this.ctx.lineTo(e.x, e.y2);
                        }
                    }
                    this.ctx.stroke();

                    // 3. Highlight walkable top edges with vibrant neon cyan rim (fused, stops cleanly at walls)
                    this.ctx.save();
                    this.ctx.strokeStyle = "#00f3ff";
                    this.ctx.lineWidth = 2.5;
                    this.ctx.shadowColor = "#00f3ff";
                    this.ctx.shadowBlur = 8;
                    this.ctx.beginPath();
                    if (level.topEdges) {
                        for (const e of level.topEdges) {
                            // Only stroke edges inside the playable world boundaries
                            if (e.y <= 0 || e.y > Config.WORLD.HEIGHT) continue;
                            this.ctx.moveTo(e.x1, e.y);
                            this.ctx.lineTo(e.x2, e.y);
                        }
                    }
                    this.ctx.stroke();
                    this.ctx.restore();
                }
            }
            drawEntity(entity, targetPoint, hitstopActive = false) {
                if (entity.isDead && !entity.markedForDeletion) { this.ctx.globalAlpha = 0.5; }
                this.ctx.save();
                const cx = entity.x + entity.width / 2; const cy = entity.y + entity.height;
                this.ctx.translate(cx, cy); this.ctx.scale(entity.scaleX, entity.scaleY); this.ctx.translate(-cx, -cy);

                if (hitstopActive) {
                    this.ctx.fillStyle = "#000000";
                    this.ctx.shadowBlur = 0;
                } else {
                    this.ctx.fillStyle = entity.color;
                    if (entity.hitFlashTimer > 0) this.ctx.fillStyle = "#fff";
                    if (entity.isDashing) this.ctx.fillStyle = "#fff";
                    this.ctx.shadowBlur = 6; this.ctx.shadowColor = entity.color;
                }
                this.ctx.fillRect(entity.x, entity.y, entity.width, entity.height);

                if (hitstopActive) {
                    this.ctx.strokeStyle = "#ffffff";
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeRect(entity.x, entity.y, entity.width, entity.height);

                    // Stylized extended action lines at the edges of the box
                    this.ctx.strokeStyle = "#ffffff";
                    this.ctx.lineWidth = 1.5;
                    this.ctx.beginPath();
                    const extent = 8;
                    // Top-Left corner lines
                    this.ctx.moveTo(entity.x - extent, entity.y);
                    this.ctx.lineTo(entity.x + extent, entity.y);
                    this.ctx.moveTo(entity.x, entity.y - extent);
                    this.ctx.lineTo(entity.x, entity.y + extent);
                    // Top-Right corner lines
                    this.ctx.moveTo(entity.x + entity.width - extent, entity.y);
                    this.ctx.lineTo(entity.x + entity.width + extent, entity.y);
                    this.ctx.moveTo(entity.x + entity.width, entity.y - extent);
                    this.ctx.lineTo(entity.x + entity.width, entity.y + extent);
                    // Bottom-Left corner lines
                    this.ctx.moveTo(entity.x - extent, entity.y + entity.height);
                    this.ctx.lineTo(entity.x + extent, entity.y + entity.height);
                    this.ctx.moveTo(entity.x, entity.y + entity.height - extent);
                    this.ctx.lineTo(entity.x, entity.y + entity.height + extent);
                    // Bottom-Right corner lines
                    this.ctx.moveTo(entity.x + entity.width - extent, entity.y + entity.height);
                    this.ctx.lineTo(entity.x + entity.width + extent, entity.y + entity.height);
                    this.ctx.moveTo(entity.x + entity.width, entity.y + entity.height - extent);
                    this.ctx.lineTo(entity.x + entity.width, entity.y + entity.height + extent);
                    this.ctx.stroke();
                }

                if (entity.hasEyes) {
                    const targetX = targetPoint ? targetPoint.x : entity.x;
                    const targetY = targetPoint ? targetPoint.y : entity.y;
                    this._drawEyes(entity, targetX, targetY, hitstopActive ? "#ffffff" : (entity.eyeColor || "#000"));
                }
                if (entity.showHealthBar && !hitstopActive) this._drawHealthBar(entity);
                if (entity.currentWeapon && !entity.isDead) {
                    // For the player, targetPoint is the Mouse.
                    // For the enemy, targetPoint is the Player's position.
                    entity.currentWeapon.draw(this.ctx, entity, targetPoint);
                }
                this.ctx.restore(); this.ctx.globalAlpha = 1.0;
            }
            _drawEyes(entity, targetX, targetY, color) {
                if (entity.isDead) return;
                const es = 4; const esp = 6; const cx = entity.x + entity.width / 2; const cy = entity.y + entity.height / 3;
                const lx = targetX - cx; const ly = targetY - cy; const mm = 3;
                const d = Math.sqrt(lx * lx + ly * ly) || 1;
                const mx = (lx / d) * mm; const my = (ly / d) * mm;
                this.ctx.fillStyle = color; this.ctx.shadowBlur = 0;
                this.ctx.fillRect(cx - esp + mx - es / 2, cy + my - es / 2, es, es);
                this.ctx.fillRect(cx + esp + mx - es / 2, cy + my - es / 2, es, es);
            }
            _drawHealthBar(entity) {
                if (entity.isDead) return;
                const hpPct = Math.max(0, entity.health / entity.maxHealth);
                this.ctx.shadowBlur = 0; this.ctx.fillStyle = "#333";
                this.ctx.fillRect(entity.x, entity.y - 8, entity.width, 3);
                this.ctx.fillStyle = "#f00";
                this.ctx.fillRect(entity.x, entity.y - 8, entity.width * hpPct, 3);
            }
            drawBullet(bullet) {
                if (bullet.isParried) {
                    this.ctx.fillStyle = "#8b0000"; // Dark red
                    this.ctx.shadowBlur = 12;
                    this.ctx.shadowColor = "#ff0000"; // Red glow
                } else {
                    this.ctx.fillStyle = bullet.isPlayer ? "#fff" : "#ffaaaa";
                    this.ctx.shadowBlur = 8;
                    this.ctx.shadowColor = bullet.isPlayer ? Config.COLORS.PLAYER : Config.COLORS.ENEMY;
                }
                this.ctx.beginPath(); this.ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2); this.ctx.fill();
            }
            drawCursor(mouse) {
                this.ctx.shadowBlur = 4; this.ctx.shadowColor = "#fff"; this.ctx.strokeStyle = "#fff"; this.ctx.lineWidth = 1;
                const mx = mouse.x; const my = mouse.y;
                this.ctx.strokeRect(mx - 6, my - 6, 12, 12);
                this.ctx.beginPath(); this.ctx.moveTo(mx, my - 2); this.ctx.lineTo(mx, my + 2);
                this.ctx.moveTo(mx - 2, my); this.ctx.lineTo(mx + 2, my); this.ctx.stroke();
            }
        }

        class Particle {
            constructor(x, y, type, color, size = null) {
                this.x = x; this.y = y; this.type = type; this.color = color; this.life = 1.0; this.size = size;
                this._initPhysics();
            }
            _initPhysics() {
                const angle = Utils.rand(0, Math.PI * 2);
                if (this.type === "dust") { this.dx = Math.cos(angle) * 0.5; this.dy = -Utils.rand(0.5, 2); this.decay = 0.04; this.size = this.size || Utils.rand(2, 4); }
                else if (this.type === "spark") { const speed = 3; this.dx = Math.cos(angle) * speed; this.dy = Math.sin(angle) * speed; this.decay = 0.06; this.size = this.size || Utils.rand(2, 5); }
                else if (this.type === "trail") { this.dx = 0; this.dy = 0; this.decay = 0.1; this.size = this.size || Utils.rand(2, 4); }
                else if (this.type === "slash") { this.dx = 0; this.dy = 0; this.decay = 0.15; this.angle = Utils.rand(0, Math.PI * 2); this.size = this.size || Utils.rand(30, 60); }
            }
            update() {
                this.x += this.dx; this.y += this.dy; this.life -= this.decay;
                if (this.type === "spark") { this.dy += 0.2; this.dx *= 0.95; }
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.color;
                ctx.shadowBlur = this.type === "spark" ? 10 : 0; ctx.shadowColor = this.color;
                if (this.type === "slash") {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    ctx.moveTo(-this.size / 2, 0);
                    ctx.lineTo(0, -2);
                    ctx.lineTo(this.size / 2, 0);
                    ctx.lineTo(0, 2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                } else {
                    ctx.fillRect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
                }
                ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;
            }
        }

        class ParticleSystem {
            constructor() { this.particles = []; }
            update() { for (let i = this.particles.length - 1; i >= 0; i--) { this.particles[i].update(); if (this.particles[i].life <= 0) this.particles.splice(i, 1); } }
            draw(ctx) { this.particles.forEach((p) => p.draw(ctx)); }
            emitDust(x, y) { for (let i = 0; i < 4; i++) this.particles.push(new Particle(x, y, "dust", "#888")); }
            emitExplosion(x, y, color) { for (let i = 0; i < 12; i++) this.particles.push(new Particle(x, y, "spark", color)); }
            emitTrail(x, y, color, size) { if (Math.random() > 0.3) this.particles.push(new Particle(x, y, "trail", color, size)); }
            emitGhost(x, y, width, height, color) { const p = new Particle(x + width / 2, y + height / 2, "trail", color, width); p.decay = 0.15; this.particles.push(p); }
            emitSlash(x, y, color, size) { this.particles.push(new Particle(x, y, "slash", color, size)); }
        }

        class UIManager {
            constructor() {
                this.uiLayer = document.getElementById("ui-layer"); this.hpFill = document.getElementById("hp-fill");
                this.jumpsContainer = document.getElementById("jumps-container"); this.dashesContainer = document.getElementById("dashes-container");
                this.weaponNameEl = document.getElementById("weapon-name"); this.cdFill = document.getElementById("cd-fill");
                this.shrineCdFill = document.getElementById("shrine-cd-fill");
                this.enemyCountVal = document.getElementById("enemy-count-val");
                this.waveVal = document.getElementById("wave-val");
                this.jumpPips = []; this.dashPips = [];
            }
            init(maxJumps, maxDashes) {
                this._createPips(this.jumpsContainer, this.jumpPips, maxJumps);
                this._createDashPips(this.dashesContainer, this.dashPips);
            }
            _createPips(container, array, count) {
                container.innerHTML = ""; array.length = 0;
                for (let i = 0; i < count; i++) { const pip = document.createElement("div"); pip.className = "pip"; container.appendChild(pip); array.push(pip); }
            }
            _createDashPips(container, array) {
                container.innerHTML = ""; array.length = 0;
                // Dash 1: Floor Dash
                const pip0 = document.createElement("div");
                pip0.className = "pip";
                pip0.title = "Dash 1: Replenishes when you hit the floor";
                container.appendChild(pip0);
                array.push(pip0);

                // Dash 2: Cooldown Dash
                const pip1 = document.createElement("div");
                pip1.className = "pip";
                pip1.title = "Dash 2: Replenishes with cooldown";
                const fill = document.createElement("div");
                fill.className = "pip-fill";
                pip1.appendChild(fill);
                container.appendChild(pip1);
                array.push(pip1);
            }
            update(player, game) {
                const hpPct = Math.max(0, player.health / player.maxHealth) * 100;
                this.hpFill.style.width = `${hpPct}%`; this.hpFill.style.backgroundColor = hpPct > 30 ? Config.COLORS.PLAYER : "#ff0000";
                this.jumpPips.forEach((pip, i) => { if (i < player.wallJumps) pip.classList.add("jump-active"); else pip.classList.remove("jump-active"); });

                // Dash 1: Floor Dash
                if (this.dashPips[0]) {
                    if (player.hasFloorDash) this.dashPips[0].classList.add("dash-active");
                    else this.dashPips[0].classList.remove("dash-active");
                }
                // Dash 2: Cooldown Dash
                if (this.dashPips[1]) {
                    const cdFill = this.dashPips[1].querySelector(".pip-fill");
                    if (player.hasCooldownDash) {
                        this.dashPips[1].classList.add("dash-active");
                        this.dashPips[1].classList.remove("dash-charging");
                        if (cdFill) cdFill.style.width = "100%";
                    } else {
                        this.dashPips[1].classList.remove("dash-active");
                        this.dashPips[1].classList.add("dash-charging");
                        if (cdFill) {
                            const progress = Math.max(0, Math.min(1, 1 - (player.cooldownDashTimer / player.cooldownDashMax)));
                            cdFill.style.width = `${progress * 100}%`;
                        }
                    }
                }
                if (player.currentWeapon) {
                    this.weaponNameEl.textContent = player.currentWeapon.name;
                    if (player.currentWeapon.isUnlimited) { this.cdFill.style.width = '100%'; this.cdFill.style.backgroundColor = "#00f3ff"; }
                    else {
                        const pct = (player.currentWeapon.cooldownTimer / player.currentWeapon.cooldownTime);
                        const displayPct = Math.max(0, 1 - pct) * 100;
                        this.cdFill.style.width = `${displayPct}%`; this.cdFill.style.backgroundColor = displayPct === 100 ? "#00f3ff" : "#888";
                    }
                }
                if (player.shrine) {
                    if (player.shrine.isActive) {
                        const pct = player.shrine.timer / player.shrine.duration;
                        this.shrineCdFill.style.width = `${pct * 100}%`;
                        this.shrineCdFill.style.backgroundColor = "#ff0055";
                    } else {
                        const pct = player.shrine.cooldown / player.shrine.maxCooldown;
                        const displayPct = Math.max(0, 1 - pct) * 100;
                        this.shrineCdFill.style.width = `${displayPct}%`;
                        this.shrineCdFill.style.backgroundColor = displayPct === 100 ? "#ff0055" : "#888";
                    }
                }
                if (game) {
                    if (this.enemyCountVal) this.enemyCountVal.textContent = game.targetEnemyCount;
                    if (this.waveVal) this.waveVal.textContent = `Wave ${game.currentWave}`;
                }
            }
        }

        class Camera {
            constructor() { this.x = 0; this.y = 0; this.shakePower = 0; }
            shake(amount) { this.shakePower = Math.max(this.shakePower, amount); }
            update(target, canvasWidth, canvasHeight) {
                let targetX = target.x + target.width / 2 - canvasWidth / 2;
                let targetY = target.y + target.height / 2 - canvasHeight / 2;
                targetX = Math.max(0, Math.min(targetX, Config.WORLD.WIDTH - canvasWidth));
                targetY = Math.max(0, Math.min(targetY, Config.WORLD.HEIGHT - canvasHeight));
                this.x += (targetX - this.x) * 0.1;
                this.y += (targetY - this.y) * 0.1;
                if (this.shakePower > 0) {
                    this.x += Utils.rand(-this.shakePower, this.shakePower); this.y += Utils.rand(-this.shakePower, this.shakePower);
                    this.shakePower *= 0.9; if (this.shakePower < 0.5) this.shakePower = 0;
                }
            }
        }
