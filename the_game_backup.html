        class Weapon {
            constructor(name, cooldownTime, isAuto) {
                this.name = name; this.cooldownTime = cooldownTime; this.cooldownTimer = 0;
                this.isUnlimited = cooldownTime === 0; this.isAuto = isAuto;
            }
            update(context, owner) { if (this.cooldownTimer > 0) this.cooldownTimer--; }
            canAttack() { return this.cooldownTimer <= 0; }
            attack(context, owner) { }
            draw(ctx, owner, targetPoint) { }
        }

        class PelletGun extends Weapon {
            constructor() { super("Pellets", 0, false); this.internalCooldown = 0; }

            update(context, owner) {
                super.update(context, owner);
                if (this.internalCooldown > 0) this.internalCooldown--;
            }

            canAttack() { return true; } // No cap on how fast you can fire!

            attack(context, owner) {
                this.internalCooldown = 8; // Keeps visual gun recoil
                const cx = owner.x + owner.width / 2; const cy = owner.y + owner.height / 2;
                const worldMouseX = context.input.mouse.x + context.camera.x;
                const worldMouseY = context.input.mouse.y + context.camera.y;
                const angle = Utils.getAngle(cx, cy, worldMouseX, worldMouseY);
                this.fire(context, owner, angle);
            }

            fire(context, owner, angle) {
                const isPlayer = owner instanceof Player;
                const speed = isPlayer ? 12 : 3.5; // Enemy bullets are slower and easier to dodge
                const bullet = new Bullet(
                    owner.x + owner.width / 2,
                    owner.y + owner.height / 2,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    isPlayer,
                    isPlayer // isPellet is true only for player bullets
                );
                context.bulletManager.add(bullet);
                if (isPlayer) {
                    context.camera.shake(2);
                    context.particles.emitExplosion(owner.x + owner.width / 2 + Math.cos(angle) * 15, owner.y + owner.height / 2 + Math.sin(angle) * 15, "#fff");
                }
            }

            draw(ctx, owner, targetPoint) {
                const cx = owner.x + owner.width / 2;
                const cy = owner.y + owner.height / 2;
                const angle = Math.atan2(targetPoint.y - cy, targetPoint.x - cx);

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);

                // Flip the gun if pointing backwards (left)
                if (Math.abs(angle) > Math.PI / 2) {
                    ctx.scale(1, -1);
                }

                // Visual Recoil snap-back
                const recoil = this.internalCooldown > 0 ? (this.internalCooldown / 8) * 3 : 0;
                ctx.translate(15 - recoil, 0);

                // Gun Grip
                ctx.fillStyle = "#222";
                ctx.fillRect(-2, 2, 6, 8);

                // Gun Body
                ctx.fillStyle = "#444";
                ctx.fillRect(-6, -4, 18, 6);

                // Neon Cyan Accent Strip
                ctx.fillStyle = "#00f3ff";
                ctx.shadowBlur = 5;
                ctx.shadowColor = "#00f3ff";
                ctx.fillRect(4, -2, 6, 2);

                ctx.restore();
            }
        }

        class Shotgun extends Weapon {
            constructor() { super("Shotgun", 80, false); }

            attack(context, owner) {
                this.cooldownTimer = this.cooldownTime;
                const cx = owner.x + owner.width / 2; const cy = owner.y + owner.height / 2;
                let targetX = owner instanceof Player ? context.input.mouse.x + context.camera.x : context.game.player.x + context.game.player.width / 2;
                let targetY = owner instanceof Player ? context.input.mouse.y + context.camera.y : context.game.player.y + context.game.player.height / 2;

                const baseAngle = Utils.getAngle(cx, cy, targetX, targetY);
                const pelletCount = 28; const spreadDegrees = 0.7;

                for (let i = 0; i < pelletCount; i++) {
                    const angle = baseAngle - (spreadDegrees / 2) + (Math.random() * spreadDegrees);
                    const speed = Utils.rand(12, 18);
                    // Pass high knockback (e.g., 14) for the shotgun pellets
                    const bullet = new Bullet(cx, cy, Math.cos(angle) * speed, Math.sin(angle) * speed, owner instanceof Player, false, 14);
                    context.bulletManager.add(bullet);
                }
                if (owner instanceof Player) {
                    context.camera.shake(15);
                    // Multi-explosion effect at the muzzle!
                    for (let j = 0; j < 12; j++) {
                        const expX = cx + Math.cos(baseAngle) * 25 + Utils.rand(-15, 15);
                        const expY = cy + Math.sin(baseAngle) * 25 + Utils.rand(-15, 15);
                        context.particles.emitExplosion(expX, expY, j % 2 === 0 ? "#FF5500" : "#FFAA00");
                    }
                    owner.dx -= Math.cos(baseAngle) * 35;
                    owner.dy -= Math.sin(baseAngle) * 20;
                }
            }

            draw(ctx, owner, targetPoint) {
                const cx = owner.x + owner.width / 2;
                const cy = owner.y + owner.height / 2;
                const angle = Math.atan2(targetPoint.y - cy, targetPoint.x - cx);

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);

                // Flip gun if pointing left
                if (Math.abs(angle) > Math.PI / 2) {
                    ctx.scale(1, -1);
                }

                // Heavy Recoil! (Kicks back hard for 10 frames)
                let recoil = 0;
                if (this.cooldownTimer > 30) {
                    recoil = ((this.cooldownTimer - 30) / 10) * 8;
                }
                ctx.translate(15 - recoil, 0);

                // Back Stock
                ctx.fillStyle = "#111";
                ctx.fillRect(-8, 0, 8, 6);

                // Main Body Housing
                ctx.fillStyle = "#333";
                ctx.fillRect(-4, -4, 14, 8);

                // Heavy Double Barrels
                ctx.fillStyle = "#555";
                ctx.fillRect(10, -4, 16, 6);

                // Pump Grip
                ctx.fillStyle = "#222";
                ctx.fillRect(10, 2, 10, 3);

                // Glowing Orange Shotgun Core
                ctx.fillStyle = "#FFAA00";
                ctx.shadowBlur = 5;
                ctx.shadowColor = "#FFAA00";
                ctx.fillRect(2, -2, 4, 4);

                ctx.restore();
            }
        }

        class VoltKatana extends Weapon {
            constructor() {
                super("Volt Katana", 12, false);
                this.comboStep = 0; this.comboTimer = 0;
                this.isSwinging = false; this.swingTimer = 0; this.swingDuration = 10;
                this.hitboxRange = 90; this.hitList = []; this.targetAngle = 0; this.swingDir = 1;
                this.slashEffects = [];
                this.hasTriggeredIframe = false;
            }

            update(context, owner) {
                super.update(context, owner);
                if (this.comboTimer > 0) {
                    this.comboTimer--;
                    if (this.comboTimer <= 0 && !this.isSwinging) this.comboStep = 0;
                }
                for (let i = this.slashEffects.length - 1; i >= 0; i--) {
                    this.slashEffects[i].life--;
                    if (this.slashEffects[i].life <= 0) this.slashEffects.splice(i, 1);
                }
                if (this.isSwinging) {
                    this.swingTimer--;
                    const progress = 1 - (this.swingTimer / this.swingDuration);
                    if (progress > 0.1 && progress < 0.9) this._checkCollisions(context, owner);
                    if (this.swingTimer <= 0) this.isSwinging = false;
                }
            }

            _checkCollisions(context, owner) {
                const cx = owner.x + owner.width / 2; const cy = owner.y + owner.height / 2;
                const targets = owner instanceof Player ? context.game.enemies : [context.game.player];
                const isSpin = this.slashEffects.length > 0 && this.slashEffects[this.slashEffects.length - 1].isSpin;
                const damage = isSpin ? 60 : 30; const knockback = isSpin ? 16 : 8;

                // Check bullets parrying during charged katana swing (isSpin)
                if (isSpin && owner instanceof Player) {
                    context.bulletManager.bullets.forEach(b => {
                        if (b.isParried) return;
                        const dist = Math.hypot(b.x - cx, b.y - cy);
                        if (dist < this.hitboxRange + b.radius) {
                            b.isParried = true;
                            b.isPlayer = true; // Targets enemies
                            b.dx = -b.dx * 2;
                            b.dy = -b.dy * 2;
                            b.bouncesLeft = 5; // Give it bounces!

                            // Emit red parry sparks
                            for (let i = 0; i < 4; i++) {
                                context.particles.emitExplosion(b.x, b.y, "#ff0000");
                            }
                        }
                    });
                }

                targets.forEach(e => {
                    if (this.hitList.includes(e) || e.isDead) return;
                    const ex = e.x + e.width / 2; const ey = e.y + e.height / 2;
                    const dist = Math.hypot(ex - cx, ey - cy);

                    if (dist < this.hitboxRange + Math.max(e.width, e.height) / 2) {
                        let hit = false;
                        if (isSpin) hit = true;
                        else {
                            const angleToEnemy = Math.atan2(ey - cy, ex - cx);
                            let diff = angleToEnemy - this.targetAngle;
                            diff = Math.atan2(Math.sin(diff), Math.cos(diff));
                            if (Math.abs(diff) < 1.2) hit = true;
                        }

                        if (hit) {
                            this.hitList.push(e);

                            // First hit of the third strike (charged version) triggers the custom hitstop/iframe
                            if (owner instanceof Player && isSpin && !this.hasTriggeredIframe) {
                                this.hasTriggeredIframe = true;
                                context.game.hitstopFrames = 30; // 30 frames of hitstop
                                owner.iframeTimer = 45; // 45 frames of iframe invincibility
                                context.camera.shake(18);
                            }

                            e.takeDamage(damage);
                            const angleToEnemy = Math.atan2(ey - cy, ex - cx);
                            e.dx = Math.cos(angleToEnemy) * knockback;
                            e.dy = Math.sin(angleToEnemy) * knockback - (isSpin ? 4 : 2);

                            if (owner instanceof Player) {
                                if (!isSpin) {
                                    context.camera.shake(5);
                                    context.game.freezeFrames = 2;
                                }
                            }
                            const sparkColor = isSpin ? "#ffff00" : "#00f3ff";
                            for (let i = 0; i < 6; i++) context.particles.emitExplosion(ex, ey, sparkColor);
                        }
                    }
                });
            }

            attack(context, owner) {
                let lungeSpeed = 6; this.swingDuration = 10;
                let arcSweep = 2.4; let color = "#00f3ff";

                if (this.comboStep === 0) this.swingDir = 1;
                else if (this.comboStep === 1) this.swingDir = -1;
                else if (this.comboStep === 2) {
                    this.swingDir = 1; lungeSpeed = 12; this.swingDuration = 16;
                    arcSweep = Math.PI * 2; color = "#ffff00";
                    this.hasTriggeredIframe = false; // Reset iframe trigger on new third strike
                }

                this.cooldownTimer = this.comboStep === 2 ? 30 : 12; this.comboTimer = 45;
                this.isSwinging = true; this.swingTimer = this.swingDuration; this.hitList = [];

                const cx = owner.x + owner.width / 2; const cy = owner.y + owner.height / 2;
                let mx, my;
                if (owner instanceof Player) { mx = context.input.mouse.x + context.camera.x; my = context.input.mouse.y + context.camera.y; }
                else { mx = context.game.player.x; my = context.game.player.y; }
                this.targetAngle = Math.atan2(my - cy, mx - cx);

                owner.dx += Math.cos(this.targetAngle) * lungeSpeed; owner.dy += Math.sin(this.targetAngle) * lungeSpeed;
                if (owner instanceof Player && this.comboStep === 2) context.camera.shake(6);

                this.slashEffects.push({
                    angle: this.targetAngle, sweep: arcSweep, dir: this.swingDir, radius: this.hitboxRange,
                    life: 12, maxLife: 12, color: color, isSpin: this.comboStep === 2
                });

                this.comboStep = (this.comboStep + 1) % 3;
            }

            draw(ctx, owner, targetPoint) {
                const cx = owner.x + owner.width / 2; const cy = owner.y + owner.height / 2;
                this.slashEffects.forEach(effect => {
                    ctx.save(); ctx.translate(cx, cy); ctx.rotate(effect.angle);
                    if (effect.dir < 0) ctx.scale(1, -1);
                    const progress = 1 - (effect.life / effect.maxLife);
                    ctx.globalAlpha = effect.life / effect.maxLife;

                    if (effect.isSpin) {
                        ctx.beginPath(); ctx.arc(0, 0, effect.radius, 0, Math.PI * 2);
                        ctx.lineWidth = 15 * (1 - progress); ctx.strokeStyle = effect.color; ctx.stroke();
                        ctx.beginPath(); ctx.arc(0, 0, effect.radius * 0.7, 0, Math.PI * 2);
                        ctx.lineWidth = 5 * (1 - progress); ctx.strokeStyle = "#ffffff"; ctx.stroke();
                    } else {
                        ctx.beginPath(); const startAng = -effect.sweep / 2; const endAng = effect.sweep / 2;
                        ctx.arc(0, 0, effect.radius, startAng, endAng);
                        ctx.lineWidth = 20 * (1 - progress); ctx.strokeStyle = effect.color; ctx.lineCap = "round"; ctx.stroke();
                        ctx.beginPath(); ctx.arc(0, 0, effect.radius - 8, startAng, endAng);
                        ctx.lineWidth = 6 * (1 - progress); ctx.strokeStyle = "#ffffff"; ctx.lineCap = "round"; ctx.stroke();
                    }
                    ctx.restore();
                });

                let angle = 0;
                if (this.isSwinging) {
                    const progress = 1 - (this.swingTimer / this.swingDuration);
                    const isSpin = this.slashEffects.length > 0 && this.slashEffects[this.slashEffects.length - 1].isSpin;
                    if (isSpin) angle = this.targetAngle + (Math.PI * 4 * progress);
                    else angle = Utils.lerp(this.targetAngle - 1.4 * this.swingDir, this.targetAngle + 1.4 * this.swingDir, progress);
                } else {
                    const mx = targetPoint.x; const my = targetPoint.y;
                    angle = Math.atan2(my - cy, mx - cx);
                }

                ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle);

                // Ensure the hilt/blade orient nicely if facing left
                if (!this.isSwinging && Math.abs(angle) > Math.PI / 2) {
                    ctx.scale(1, -1);
                }

                let forwardOffset = this.isSwinging ? 25 : 15;
                ctx.translate(forwardOffset, 0);

                ctx.fillStyle = "#111"; ctx.fillRect(0, -3, 16, 6);
                ctx.fillStyle = "#444"; ctx.fillRect(14, -8, 4, 16);
                ctx.fillStyle = "#ccc";
                ctx.beginPath(); ctx.moveTo(18, -2); ctx.lineTo(18 + this.hitboxRange * 0.8, -2);
                ctx.lineTo(18 + this.hitboxRange * 0.8 + 10, 0); ctx.lineTo(18 + this.hitboxRange * 0.8, 2);
                ctx.lineTo(18, 2); ctx.closePath(); ctx.fill();

                const glowColor = (this.comboStep === 2 && this.comboTimer > 0) ? "#ffff00" : "#00f3ff";
                ctx.fillStyle = glowColor; ctx.shadowBlur = 10; ctx.shadowColor = glowColor;
                ctx.beginPath(); ctx.moveTo(18, -2); ctx.lineTo(18 + this.hitboxRange * 0.8, -2);
                ctx.lineTo(18 + this.hitboxRange * 0.8 + 10, 0); ctx.closePath(); ctx.fill();
                ctx.restore();
            }
        }

        // ================== GAME OBJECTS ==================
        class Entity {
            constructor(x, y, w, h, color) {
                this.x = x; this.y = y; this.width = w; this.height = h; this.color = color;
                this.dx = 0; this.dy = 0; this.onGround = false; this.onWall = false;
                this.scaleX = 1; this.scaleY = 1; this.facing = "right";
                this.isDashing = false; this.hitFlashTimer = 0; this.hasEyes = false;
                this.showHealthBar = false; this.currentWeapon = null; this.isDead = false;
                this.markedForDeletion = false;
            }
            updateAnimation() {
                this.scaleX = Utils.lerp(this.scaleX, 1, 0.2); this.scaleY = Utils.lerp(this.scaleY, 1, 0.2);
                if (this.hitFlashTimer > 0) this.hitFlashTimer--;
            }
        }

        class Actor extends Entity {
            constructor(x, y, w, h, color, health) {
                super(x, y, w, h, color); this.health = health; this.maxHealth = health;
                this.wallJumps = 0;
            }
            takeDamage(amount) {
                if (this.isDead) return;
                this.health -= amount; this.hitFlashTimer = 5;
            }
        }

        class Player extends Actor {
            constructor() {
                super(100, 900, 24, 24, Config.COLORS.PLAYER, 100);
                this.hasEyes = true; this.eyeColor = Config.COLORS.PLAYER_EYES;
                this.wallJumpsMax = 3; this.wallJumps = 3;
                this.maxDashes = 2;
                this.hasFloorDash = true;
                this.hasCooldownDash = true;
                this.cooldownDashTimer = 0;
                this.cooldownDashMax = 75; // ~1.25s cooldown
                this.dashFrameTimer = 0; this.dashDir = { x: 0, y: 0 };
                this.coyoteTimer = 0; this.jumpBufferTimer = 0;
                this.iframeTimer = 0;

                this.weapons = [new PelletGun(), new Shotgun(), new VoltKatana()];
                this.weaponIndex = 0; this.currentWeapon = this.weapons[0];
                this.shrine = new MalevolentShrine(this);
            }

            get dashes() {
                return (this.hasFloorDash ? 1 : 0) + (this.hasCooldownDash ? 1 : 0);
            }

            set dashes(val) {
                if (val <= 0) {
                    this.hasFloorDash = false;
                    this.hasCooldownDash = false;
                } else if (val === 1) {
                    this.hasFloorDash = true;
                } else {
                    this.hasFloorDash = true;
                    this.hasCooldownDash = true;
                    this.cooldownDashTimer = 0;
                }
            }

            takeDamage(amount) {
                if (this.iframeTimer > 0) return; // If iframe is active, take no damage
                super.takeDamage(amount);
            }

            update(context) {
                if (this.iframeTimer > 0) this.iframeTimer--;
                this.checkDeathAndRespawn(context);
                this.updateAnimation();
                this._handleInput(context);
                this._handlePhysics(context);
                this._checkWorldBounds();
                if (this.currentWeapon) this.currentWeapon.update(context, this);
                this.shrine.update(context);

                // Replenish second dash with cooldown
                if (!this.hasCooldownDash) {
                    if (this.cooldownDashTimer > 0) {
                        this.cooldownDashTimer--;
                    }
                    if (this.cooldownDashTimer <= 0) {
                        this.hasCooldownDash = true;
                        this.cooldownDashTimer = 0;
                        context.particles.emitTrail(this.x + this.width / 2, this.y + this.height / 2, Config.COLORS.DASH_ACTIVE, 4);
                    }
                }
            }

            checkDeathAndRespawn(context) {
                if (this.health <= 0) {
                    context.particles.emitExplosion(this.x + this.width / 2, this.y + this.height / 2, this.color);
                    context.camera.shake(10);
                    context.game.freezeFrames = 5;
                    this.health = this.maxHealth;
                    this.x = 100;
                    this.y = 900;
                    this.dx = 0; this.dy = 0;
                    this.isDashing = false;
                    this.isDead = false;
                    this.hasFloorDash = true;
                    this.hasCooldownDash = true;
                    this.cooldownDashTimer = 0;
                }
            }

            _handleInput(context) {
                const input = context.input;

                if (input.isPressed("e") || input.isPressed("q")) {
                    this.weaponIndex = (this.weaponIndex + 1) % this.weapons.length;
                    this.currentWeapon = this.weapons[this.weaponIndex];
                }

                if (context.input.isPressed("g")) {
                    this.shrine.activate();
                }

                if (this.onGround) this.coyoteTimer = 6; else this.coyoteTimer--;
                if (input.isPressed("w")) this.jumpBufferTimer = 5; else this.jumpBufferTimer--;
                if (!input.isDown("w") && this.dy < -3 && !this.isDashing) this.dy *= Config.PHYSICS.JUMP_CUTOFF;
                if (input.isPressed("shift") && this.dashes > 0 && !this.isDashing) this._startDash(context, input);

                if (this.currentWeapon) {
                    const shouldFire = this.currentWeapon.isAuto ? input.mouse.down : input.mouse.pressed;
                    if (shouldFire && this.currentWeapon.canAttack()) this.currentWeapon.attack(context, this);
                }
            }

            _startDash(context, input) {
                this.isDashing = true;
                this.dashFrameTimer = Config.PHYSICS.DASH_DURATION;

                // Consume floor dash first if available; otherwise consume cooldown dash
                if (this.hasFloorDash) {
                    this.hasFloorDash = false;
                } else if (this.hasCooldownDash) {
                    this.hasCooldownDash = false;
                    this.cooldownDashTimer = this.cooldownDashMax;
                }

                let dx = 0; let dy = 0;
                if (input.isDown("w")) dy = -1; if (input.isDown("s")) dy = 1;
                if (input.isDown("a")) dx = -1; if (input.isDown("d")) dx = 1;
                if (dx === 0 && dy === 0) dx = this.facing === "left" ? -1 : 1;
                const len = Math.sqrt(dx * dx + dy * dy);
                if (len !== 0) { dx /= len; dy /= len; }
                this.dashDir = { x: dx, y: dy };
                this.dx = this.dashDir.x * Config.PHYSICS.DASH_SPEED; this.dy = this.dashDir.y * Config.PHYSICS.DASH_SPEED;
                context.camera.shake(4); context.game.freezeFrames = 3;
                context.particles.emitGhost(this.x, this.y, this.width, this.height, Config.COLORS.DASH_ACTIVE);
            }

            _handlePhysics(context) {
                if (this.isDashing) this._updateDashPhysics(context);
                else {
                    let dir = 0;
                    if (context.input.isDown("a")) { dir = -1; this.facing = "left"; } else if (context.input.isDown("d")) { dir = 1; this.facing = "right"; }
                    if (dir !== 0) {
                        if (Math.abs(this.dx) > Config.PHYSICS.RUN_SPEED && Math.sign(this.dx) === dir) {
                            const friction = this.onGround ? Config.PHYSICS.GROUND_FRICTION : Config.PHYSICS.AIR_RESISTANCE;
                            this.dx *= friction;
                        } else {
                            this.dx += dir * Config.PHYSICS.ACCEL;
                            if (Math.abs(this.dx) > Config.PHYSICS.RUN_SPEED && Math.sign(this.dx) === dir) this.dx = dir * Config.PHYSICS.RUN_SPEED;
                        }
                    } else context.physics.applyFriction(this);

                    if (this.jumpBufferTimer > 0 && this.coyoteTimer > 0) { this._jump(context, false); this.jumpBufferTimer = 0; this.coyoteTimer = 0; }
                    if (this.onWall && this.wallJumps > 0 && context.input.isPressed("w")) this._jump(context, true);

                    context.physics.applyGravity(this);
                    context.physics.resolveCollisions(this);
                    // Replenish first dash when hitting the floor
                    if (this.onGround) {
                        this.wallJumps = this.wallJumpsMax;
                        this.hasFloorDash = true;
                    }
                }
            }

            _updateDashPhysics(context) {
                this.dashFrameTimer--;
                this.dx = this.dashDir.x * Config.PHYSICS.DASH_SPEED; this.dy = this.dashDir.y * Config.PHYSICS.DASH_SPEED;
                if (this.dashFrameTimer % 2 === 0) context.particles.emitGhost(this.x, this.y, this.width, this.height, "rgba(255, 255, 255, 0.5)");
                if (this.dashFrameTimer <= 0) { this.isDashing = false; this.dx *= 0.8; this.dy *= 0.5; }
                context.physics.resolveCollisions(this);
                if (this.onGround && !this.isDashing) {
                    this.hasFloorDash = true;
                }
            }

            _jump(context, isWall) {
                if (isWall) {
                    if (this.isDashing && this.dashDir.y < 0) { this.isDashing = false; this.dy = Config.PHYSICS.JUMP_POWER * 1.3; }
                    else if (!context.input.isDown("a") && !context.input.isDown("d")) { this.dy = Config.PHYSICS.JUMP_POWER; this.dx = this.onWall === "left" ? 3 : -3; }
                    else { this.dy = Config.PHYSICS.JUMP_POWER; this.dx = this.onWall === "left" ? 6 : -6; }
                    this.wallJumps--; this.facing = this.onWall === "left" ? "right" : "left";
                    context.particles.emitDust(this.onWall === "left" ? this.x : this.x + this.width, this.y + this.height / 2);
                } else {
                    this.dy = Config.PHYSICS.JUMP_POWER;
                    context.particles.emitDust(this.x + this.width / 2, this.y + this.height);
                }
                this.scaleX = 0.6; this.scaleY = 1.4;
            }

            _checkWorldBounds() { if (this.y > Config.WORLD.HEIGHT + 100) this.health = 0; }
        }

        class HealthPacket extends Entity {
            constructor(x, y) {
                super(x, y, 16, 16, "#ff2d55");
                this.dx = Utils.rand(-2.5, 2.5);
                this.dy = Utils.rand(-5, -8);
                this.bounceCount = 0;
                this.pulseTimer = 0;
            }

            update(context) {
                this.pulseTimer += 0.1;

                // Physics
                context.physics.applyGravity(this);
                context.physics.applyFriction(this);

                const wasOnGround = this.onGround;
                context.physics.resolveCollisions(this);

                if (this.onGround && !wasOnGround && this.bounceCount < 2) {
                    this.dy = -3 / (this.bounceCount + 1);
                    this.bounceCount++;
                }

                // Magnet pulling attraction to Player if within range (150px)
                const player = context.game.player;
                const dist = Utils.dist(this.x + this.width / 2, this.y + this.height / 2, player.x + player.width / 2, player.y + player.height / 2);
                if (dist < 150) {
                    const angle = Math.atan2((player.y + player.height / 2) - (this.y + this.height / 2), (player.x + player.width / 2) - (this.x + this.width / 2));
                    const pullSpeed = 5 * (1 - dist / 150) + 1;
                    this.dx += Math.cos(angle) * pullSpeed * 0.4;
                    this.dy += Math.sin(angle) * pullSpeed * 0.4;
                }

                // Collection
                if (Utils.checkAABB(this, player)) {
                    this.markedForDeletion = true;
                    const healAmt = player.maxHealth / 8;
                    player.health = Math.min(player.maxHealth, player.health + healAmt);

                    // Flash green heal particles!
                    for (let i = 0; i < 15; i++) {
                        context.particles.particles.push(new Particle(this.x + this.width / 2, this.y + this.height / 2, "spark", "#00ff66", Utils.rand(3, 6)));
                    }
                    context.camera.shake(2);
                }
            }

            draw(ctx) {
                ctx.save();
                const cx = this.x + this.width / 2;
                const cy = this.y + this.height / 2;

                const bounceOffset = Math.sin(this.pulseTimer) * 3;
                ctx.translate(cx, cy + bounceOffset);

                ctx.shadowBlur = 10;
                ctx.shadowColor = "#ff2d55";

                ctx.fillStyle = "#ff2d55";
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#ffffff";
                ctx.shadowBlur = 0;
                ctx.fillRect(-2, -5, 4, 10);
                ctx.fillRect(-5, -2, 10, 4);

                ctx.restore();
            }
        }

        class Enemy extends Actor {
            constructor(x, y) {
                super(x, y, 24, 24, Config.COLORS.ENEMY, 80);
                this.hasEyes = true;
                this.eyeColor = Config.COLORS.ENEMY_EYES;
                this.showHealthBar = true;
                this.deathTimer = 0;

                // AI State Machine
                this.state = "IDLE";
                this.stateTimer = 0;
                this.visionRange = 450;
                this.attackRange = 300;

                // --- FIRERATE FIX ---
                this.shootCooldownMax = 35; // Decrease this to make them fire faster
                this.shootTimer = Math.random() * 30; // Random start so they don't all fire at once

                // Movement AI
                this.moveDir = 0;
                this.jumpCooldown = 0;

                this.currentWeapon = new PelletGun();
            }

            takeDamage(amount) {
                if (this.isDead) return;
                super.takeDamage(amount);
                this.state = "CHASE";
                if (this.health <= 0) {
                    this.isDead = true;
                    this.color = Config.COLORS.ENEMY_DEAD;
                    this.deathTimer = 40;
                    this.showHealthBar = false;
                    this.hasEyes = false;
                }
            }

            update(context) {
                if (this.isDead) {
                    this.dx = 0; this.dy = 0;
                    this.deathTimer--;
                    if (this.deathTimer <= 0) {
                        this.markedForDeletion = true;
                        context.particles.emitExplosion(this.x + this.width / 2, this.y + this.height / 2, "#ff0000");
                        if (context.game.healthPackets) {
                            context.game.healthPackets.push(new HealthPacket(this.x + this.width / 2 - 8, this.y + this.height / 2 - 8));
                        }
                    }
                    return;
                }

                this._think(context);
                this._applyMovement(context);
                this.updateAnimation();

                if (this.currentWeapon) this.currentWeapon.update(context, this);
                if (this.shootTimer > 0) this.shootTimer--; // Tick down the shoot delay

                context.physics.applyGravity(this);
                context.physics.resolveCollisions(this);
                if (this.jumpCooldown > 0) this.jumpCooldown--;
            }

            _think(context) {
                const player = context.game.player;
                const dist = Utils.dist(this.x, this.y, player.x, player.y);

                if (dist < this.visionRange) {
                    this.state = (dist < this.attackRange) ? "ATTACK" : "CHASE";
                } else {
                    this.state = "PATROL";
                }

                switch (this.state) {
                    case "CHASE":
                        this.moveDir = player.x < this.x ? -1 : 1;
                        this._handleObstacles(context, player);
                        break;

                    case "ATTACK":
                        this.moveDir = player.x < this.x ? -0.2 : 0.2;

                        // --- FIRERATE LOGIC ---
                        if (this.shootTimer <= 0 && this.currentWeapon) {
                            const aimTarget = {
                                x: player.x + player.width / 2 + Utils.rand(-30, 30), // Added slight inaccuracy
                                y: player.y + player.height / 2 + Utils.rand(-30, 30)
                            };
                            const angle = Utils.getAngle(this.x, this.y, aimTarget.x, aimTarget.y);

                            this.currentWeapon.fire(context, this, angle);

                            // Reset timer: Base delay + a bit of randomness so it's not robotic
                            this.shootTimer = this.shootCooldownMax + Math.random() * 40;
                        }
                        break;

                    case "PATROL":
                        if (this.stateTimer <= 0) {
                            this.moveDir = Math.random() > 0.5 ? 1 : -1;
                            this.stateTimer = 100 + Math.random() * 100;
                        }
                        this.stateTimer--;
                        this._handleObstacles(context, null);
                        break;
                }
            }

            _handleObstacles(context, player) {
                // Jump if hitting a wall
                if (this.onWall && this.jumpCooldown <= 0) {
                    this.dy = Config.PHYSICS.JUMP_POWER * 0.9;
                    this.jumpCooldown = 30;
                }

                // Wall Scaling (Player is high above)
                if (player && player.y < this.y - 60 && this.onWall) {
                    this.dy = Config.PHYSICS.JUMP_POWER * 1.1;
                    this.dx = this.onWall === "left" ? 5 : -5;
                    this.jumpCooldown = 25;
                }

                // Gap jumping
                if (Math.abs(this.dx) < 0.2 && this.onGround && this.moveDir !== 0 && this.jumpCooldown <= 0) {
                    this.dy = Config.PHYSICS.JUMP_POWER * 0.7;
                    this.jumpCooldown = 50;
                }
            }

            _applyMovement(context) {
                const accel = this.onGround ? Config.PHYSICS.ACCEL * 0.5 : Config.PHYSICS.ACCEL * 0.2;
                const maxSpeed = Config.PHYSICS.RUN_SPEED * 0.6;
                this.dx += this.moveDir * accel;
                if (Math.abs(this.dx) > maxSpeed) this.dx = Math.sign(this.dx) * maxSpeed;
                context.physics.applyFriction(this);
            }
        }

        class MalevolentShrine {
            constructor(owner) {
                this.owner = owner;
                this.isActive = false;
                this.timer = 0;
                this.duration = 300;
                this.radius = 350;
                this.cooldown = 0;
                this.maxCooldown = 900; // 15 seconds
            }

            activate() {
                if (this.cooldown > 0) return;
                this.isActive = true;
                this.timer = this.duration;
                this.cooldown = this.maxCooldown;
                // Set the center of the shrine to where the player is at the moment of casting
                this.origin = { x: this.owner.x + this.owner.width / 2, y: this.owner.y + this.owner.height / 2 };
            }

            update(context) {
                if (this.cooldown > 0) this.cooldown--;
                if (!this.isActive) return;

                this.timer--;
                if (this.timer <= 0) {
                    this.isActive = false;
                    return;
                }

                // Logic: Search for enemies within the world context
                context.game.enemies.forEach(enemy => {
                    if (enemy.isDead) return;
                    const d = Utils.dist(this.origin.x, this.origin.y, enemy.x + enemy.width / 2, enemy.y + enemy.height / 2);

                    if (d < this.radius) {
                        // High-frequency tick damage (Cleave/Dismantle)
                        if (this.timer % 3 === 0) {
                            enemy.takeDamage(2);
                            context.particles.emitExplosion(enemy.x + Utils.rand(0, 20), enemy.y + Utils.rand(0, 20), "#ff0000");
                            context.particles.emitSlash(enemy.x + enemy.width / 2 + Utils.rand(-15, 15), enemy.y + enemy.height / 2 + Utils.rand(-15, 15), "#ffffff", Utils.rand(40, 80));
                            if (Math.random() > 0.8) context.camera.shake(2);
                        }
                    }
                });
            }

            draw(ctx) {
                if (!this.isActive) return;

                // Draw the "Circle of Death"
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.origin.x, this.origin.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = "rgba(255, 0, 0, 0.3)";
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 15]);
                ctx.stroke();

                // Draw the Shrine Structure
                ctx.save();
                ctx.translate(this.origin.x, this.origin.y + 12);

                // Shrine aura/glow
                const glow = ctx.createRadialGradient(0, -100, 0, 0, -100, 200);
                glow.addColorStop(0, "rgba(255, 0, 0, 0.4)");
                glow.addColorStop(1, "rgba(0, 0, 0, 0)");
                ctx.fillStyle = glow;
                ctx.fillRect(-200, -300, 400, 400);

                // Base platform
                ctx.fillStyle = "#111";
                ctx.fillRect(-100, -20, 200, 40);
                ctx.fillStyle = "#222";
                ctx.fillRect(-80, -30, 160, 10);

                // Skulls/Bones pile
                ctx.fillStyle = "#ddd";
                const drawSkull = (x, y) => {
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                };
                const skullPositions = [
                    [-60, -15], [-40, -10], [-20, -5], [0, -2], [20, -8], [40, -12], [60, -18],
                    [-70, -5], [-50, 0], [-30, 5], [-10, 8], [10, 5], [30, 2], [50, -5], [70, -10],
                    [-80, 5], [-60, 10], [-40, 15], [-20, 18], [0, 20], [20, 18], [40, 12], [60, 8], [80, 0]
                ];
                skullPositions.forEach(pos => drawSkull(pos[0], pos[1]));

                // Main body
                ctx.fillStyle = "#1a0505";
                ctx.fillRect(-60, -150, 120, 120);

                // Central Mouth/Opening
                ctx.fillStyle = "#000";
                ctx.beginPath();
                ctx.moveTo(-30, -30);
                ctx.lineTo(-30, -120);
                ctx.lineTo(30, -120);
                ctx.lineTo(30, -30);
                ctx.fill();

                // Teeth
                ctx.fillStyle = "#eee";
                for (let i = 0; i < 6; i++) {
                    ctx.beginPath();
                    ctx.moveTo(-25 + i * 10, -120);
                    ctx.lineTo(-20 + i * 10, -105);
                    ctx.lineTo(-15 + i * 10, -120);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(-25 + i * 10, -30);
                    ctx.lineTo(-20 + i * 10, -45);
                    ctx.lineTo(-15 + i * 10, -30);
                    ctx.fill();
                }

                // Roofs
                ctx.fillStyle = "#3a0a0a";
                ctx.beginPath(); ctx.moveTo(-100, -150); ctx.quadraticCurveTo(0, -180, 100, -150); ctx.lineTo(80, -165); ctx.lineTo(-80, -165); ctx.fill();
                ctx.beginPath(); ctx.moveTo(-80, -165); ctx.quadraticCurveTo(0, -200, 80, -165); ctx.lineTo(60, -185); ctx.lineTo(-60, -185); ctx.fill();
                ctx.beginPath(); ctx.moveTo(-60, -185); ctx.quadraticCurveTo(0, -220, 60, -185); ctx.lineTo(30, -210); ctx.lineTo(-30, -210); ctx.fill();

                // Top Spire
                ctx.fillStyle = "#5a1a1a";
                ctx.fillRect(-4, -250, 8, 40);
                ctx.beginPath(); ctx.arc(0, -250, 8, 0, Math.PI * 2); ctx.fill();

                // Pillars
                ctx.fillStyle = "#4a0a0a";
                ctx.fillRect(-55, -150, 10, 120);
                ctx.fillRect(45, -150, 10, 120);

                ctx.restore();

                // Random Slash Visuals (Dismantle)
                for (let i = 0; i < 3; i++) {
                    const x = this.origin.x + Utils.rand(-this.radius, this.radius);
                    const y = this.origin.y + Utils.rand(-this.radius, this.radius);
                    if (Utils.dist(x, y, this.origin.x, this.origin.y) < this.radius) {
                        ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(x - 30, y - 5);
                        ctx.lineTo(x + 30, y + 5);
                        ctx.stroke();
                    }
                }
                ctx.restore();
            }
        }

        class Bullet extends Entity {
            constructor(x, y, dx, dy, isPlayer, isPellet = false, knockback = 0) {
                super(x, y, 0, 0, "#fff");
                this.dx = dx;
                this.dy = dy;
                this.isPlayer = isPlayer;
                this.isPellet = isPellet;
                this.bouncesLeft = isPellet ? 3 : 0;
                this.radius = isPlayer ? 3 : 8; // Enemy bullets are bigger (8px radius)
                this.knockback = knockback;
                this.isParried = false;
            }
            update(context) { this.x += this.dx; this.y += this.dy; }
        }

        class BulletManager {
            constructor() { this.bullets = []; }
            add(bullet) { this.bullets.push(bullet); }
            update(context) {
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const b = this.bullets[i]; b.update(context);
                    context.particles.emitTrail(b.x, b.y, b.isParried ? "#ff0000" : (b.isPlayer ? Config.COLORS.PLAYER : Config.COLORS.ENEMY), b.radius);
                    if (b.x < 0 || b.x > Config.WORLD.WIDTH || b.y < 0 || b.y > Config.WORLD.HEIGHT) { this.bullets.splice(i, 1); continue; }
                    let hitPlat = false;
                    for (let plat of context.level.platforms) {
                        const bBox = { x: b.x - b.radius, y: b.y - b.radius, width: b.radius * 2, height: b.radius * 2 };
                        if (Utils.checkAABB(bBox, plat)) {
                            if ((b.isPellet || b.isParried) && b.bouncesLeft > 0) {
                                // Determine overlap axis to resolve bouncing bounce direction
                                const overlapX = Math.min(bBox.x + bBox.width, plat.x + plat.width) - Math.max(bBox.x, plat.x);
                                const overlapY = Math.min(bBox.y + bBox.height, plat.y + plat.height) - Math.max(bBox.y, plat.y);
                                if (overlapX < overlapY) {
                                    b.dx = -b.dx;
                                    b.x += b.dx > 0 ? overlapX : -overlapX;
                                } else {
                                    b.dy = -b.dy;
                                    b.y += b.dy > 0 ? overlapY : -overlapY;
                                }
                                b.bouncesLeft--;
                                context.particles.emitExplosion(b.x, b.y, b.isParried ? "#ff0000" : "#00f3ff");
                            } else {
                                hitPlat = true;
                                context.particles.emitExplosion(b.x, b.y, "#ccc");
                                break;
                            }
                        }
                    }
                    if (hitPlat) { this.bullets.splice(i, 1); continue; }
                    if (b.isPlayer) {
                        const enemies = context.game.enemies;
                        for (let j = enemies.length - 1; j >= 0; j--) {
                            let e = enemies[j]; if (e.isDead) continue;
                            if (Utils.checkAABB({ x: b.x - b.radius, y: b.y - b.radius, width: b.radius * 2, height: b.radius * 2 }, e)) {
                                const dmg = b.isParried ? 40 : 20;
                                e.takeDamage(dmg);
                                if (b.knockback > 0) {
                                    const angle = Math.atan2(b.dy, b.dx);
                                    e.dx += Math.cos(angle) * b.knockback;
                                    e.dy += Math.sin(angle) * b.knockback - 2;
                                }
                                context.particles.emitExplosion(b.x, b.y, b.isParried ? "#ff0000" : Config.COLORS.ENEMY);
                                this.bullets.splice(i, 1);
                                break;
                            }
                        }
                    } else {
                        const p = context.game.player;
                        if (Utils.checkAABB({ x: b.x - b.radius, y: b.y - b.radius, width: b.radius * 2, height: b.radius * 2 }, p)) {
                            p.takeDamage(10); context.particles.emitExplosion(b.x, b.y, Config.COLORS.PLAYER); this.bullets.splice(i, 1);
                        }
                    }
                }
            }
            draw(renderSystem) { this.bullets.forEach((b) => renderSystem.drawBullet(b)); }
        }

        class Level {
            constructor() {
                const w = Config.WORLD.WIDTH; const h = Config.WORLD.HEIGHT;
                this.platforms = [
                    { x: -40, y: 0, width: 40, height: h }, { x: w, y: 0, width: 40, height: h },
                    { x: 0, y: -40, width: w, height: 40 }, { x: 0, y: h - 40, width: w, height: 80 },
                    { x: 0, y: 1000, width: 250, height: 20 }, { x: 250, y: 900, width: 20, height: 120 },
                    { x: 400, y: 950, width: 150, height: 20 }, { x: 700, y: 850, width: 150, height: 20 },
                    { x: 1000, y: 950, width: 150, height: 20 }, { x: 1700, y: 600, width: 20, height: 600 },
                    { x: 1850, y: 800, width: 100, height: 20 }, { x: 150, y: 750, width: 400, height: 20 },
                    { x: 800, y: 650, width: 400, height: 20 }, { x: 600, y: 500, width: 20, height: 250 },
                    { x: 1200, y: 500, width: 20, height: 250 }, { x: 200, y: 550, width: 150, height: 20 },
                    { x: 50, y: 400, width: 200, height: 20 }, { x: 650, y: 350, width: 200, height: 20 },
                    { x: 1050, y: 350, width: 200, height: 20 }, { x: 1500, y: 250, width: 400, height: 20 },
                    { x: 1400, y: 150, width: 20, height: 120 },
                ];
                this.buildMergedGeometry();
            }

            buildMergedGeometry() {
                const platforms = this.platforms;
                const xSet = new Set();
                const ySet = new Set();
                for (const p of platforms) {
                    xSet.add(p.x);
                    xSet.add(p.x + p.width);
                    ySet.add(p.y);
                    ySet.add(p.y + p.height);
                }
                const xs = Array.from(xSet).sort((a, b) => a - b);
                const ys = Array.from(ySet).sort((a, b) => a - b);

                const grid = [];
                for (let ix = 0; ix < xs.length - 1; ix++) {
                    grid[ix] = [];
                    const midX = (xs[ix] + xs[ix + 1]) / 2;
                    for (let iy = 0; iy < ys.length - 1; iy++) {
                        const midY = (ys[iy] + ys[iy + 1]) / 2;
                        let solid = false;
                        for (const p of platforms) {
                            if (midX > p.x && midX < p.x + p.width && midY > p.y && midY < p.y + p.height) {
                                solid = true;
                                break;
                            }
                        }
                        grid[ix][iy] = solid;
                    }
                }

                const isSolid = (ix, iy) => {
                    if (ix < 0 || ix >= xs.length - 1 || iy < 0 || iy >= ys.length - 1) return false;
                    return grid[ix][iy];
                };

                const rawTopEdges = [];
                const rawBottomEdges = [];
                for (let iy = 0; iy < ys.length; iy++) {
                    const y = ys[iy];
                    for (let ix = 0; ix < xs.length - 1; ix++) {
                        const solidAbove = isSolid(ix, iy - 1);
                        const solidBelow = isSolid(ix, iy);
                        if (!solidAbove && solidBelow) {
                            rawTopEdges.push({ x1: xs[ix], x2: xs[ix + 1], y: y });
                        } else if (solidAbove && !solidBelow) {
                            rawBottomEdges.push({ x1: xs[ix], x2: xs[ix + 1], y: y });
                        }
                    }
                }

                const rawLeftEdges = [];
                const rawRightEdges = [];
                for (let ix = 0; ix < xs.length; ix++) {
                    const x = xs[ix];
                    for (let iy = 0; iy < ys.length - 1; iy++) {
                        const solidLeft = isSolid(ix - 1, iy);
                        const solidRight = isSolid(ix, iy);
                        if (!solidLeft && solidRight) {
                            rawLeftEdges.push({ x: x, y1: ys[iy], y2: ys[iy + 1] });
                        } else if (solidLeft && !solidRight) {
                            rawRightEdges.push({ x: x, y1: ys[iy], y2: ys[iy + 1] });
                        }
                    }
                }

                const mergeH = (edges) => {
                    edges.sort((a, b) => a.y !== b.y ? a.y - b.y : a.x1 - b.x1);
                    const merged = [];
                    for (const e of edges) {
                        if (merged.length > 0) {
                            const last = merged[merged.length - 1];
                            if (last.y === e.y && Math.abs(last.x2 - e.x1) < 0.01) {
                                last.x2 = e.x2;
                                continue;
                            }
                        }
                        merged.push({ ...e });
                    }
                    return merged;
                };

                const mergeV = (edges) => {
                    edges.sort((a, b) => a.x !== b.x ? a.x - b.x : a.y1 - b.y1);
                    const merged = [];
                    for (const e of edges) {
                        if (merged.length > 0) {
                            const last = merged[merged.length - 1];
                            if (last.x === e.x && Math.abs(last.y2 - e.y1) < 0.01) {
                                last.y2 = e.y2;
                                continue;
                            }
                        }
                        merged.push({ ...e });
                    }
                    return merged;
                };

                this.topEdges = mergeH(rawTopEdges);
                this.bottomEdges = mergeH(rawBottomEdges);
                this.leftEdges = mergeV(rawLeftEdges);
                this.rightEdges = mergeV(rawRightEdges);

                this.allOuterEdges = [
                    ...this.topEdges.map(e => ({ x1: e.x1, y1: e.y, x2: e.x2, y2: e.y })),
                    ...this.bottomEdges.map(e => ({ x1: e.x1, y1: e.y, x2: e.x2, y2: e.y })),
                    ...this.leftEdges.map(e => ({ x1: e.x, y1: e.y1, x2: e.x, y2: e.y2 })),
                    ...this.rightEdges.map(e => ({ x1: e.x, y1: e.y1, x2: e.x, y2: e.y2 })),
                ];
            }
        }

        class CyberpunkBackdrop {
            constructor() {
                this.img = new Image();
                this.img.src = "/cyberpunk_city.jpg";
                this.imgLoaded = false;
                this.img.onload = () => { this.imgLoaded = true; };

                this.time = 0;
                this.holoAngle = 0;

                // Distant skyline spires (purely deep background silhouette)
                this.distantSpires = [];
                let curX = -200;
                while (curX < 2400) {
                    const w = Utils.rand(30, 65);
                    const h = Utils.rand(140, 260);
                    const hasSpire = Math.random() > 0.4;
                    const spireH = hasSpire ? Utils.rand(20, 50) : 0;
                    const beaconColor = Math.random() > 0.5 ? "#ff1a4a" : "#ff9900";
                    const beaconOffset = Utils.rand(0, Math.PI * 2);

                    // Very subtle, dim pinpoints of light (distant windows, not sharp blocks)
                    const pinpoints = [];
                    const rows = Math.floor(h / 14);
                    const cols = Math.floor((w - 6) / 10);
                    for (let r = 2; r < rows - 2; r++) {
                        for (let c = 0; c < cols; c++) {
                            if (Math.random() < 0.22) {
                                const isCyan = Math.random() < 0.5;
                                pinpoints.push({
                                    rx: 3 + c * 10,
                                    ry: r * 14,
                                    color: isCyan ? "rgba(0, 243, 255, " : "rgba(255, 180, 50, ",
                                    alpha: Utils.rand(0.08, 0.22)
                                });
                            }
                        }
                    }

                    this.distantSpires.push({
                        x: curX,
                        w: w,
                        h: h,
                        spireH: spireH,
                        beaconColor: beaconColor,
                        beaconOffset: beaconOffset,
                        pinpoints: pinpoints
                    });
                    curX += w + Utils.rand(8, 24);
                }

                // Distant skycraft (tiny specks high in the upper atmosphere, not in the playfield)
                this.distantFlyers = [
                    { x: 150, y: 45, speed: 0.8, dir: 1, color: "rgba(0, 243, 255, 0.35)" },
                    { x: 700, y: 75, speed: 0.6, dir: -1, color: "rgba(255, 50, 100, 0.3)" },
                    { x: 400, y: 30, speed: 1.0, dir: 1, color: "rgba(255, 180, 50, 0.35)" }
                ];
            }

            update() {
                this.time++;
                this.holoAngle += 0.001;

                for (const f of this.distantFlyers) {
                    f.x += f.speed * f.dir;
                    if (f.dir > 0 && f.x > 2200) f.x = -100;
                    else if (f.dir < 0 && f.x < -100) f.x = 2200;
                }
            }

            draw(ctx, camera, screenW, screenH, isHitstop) {
                // --- 1. SKY GRADIENT (INVERTED IN HITSTOP) ---
                const skyGrad = ctx.createLinearGradient(0, 0, 0, screenH);
                if (isHitstop) {
                    // Inverted high-impact negative silver sky
                    skyGrad.addColorStop(0, "#eef3f7");
                    skyGrad.addColorStop(0.35, "#d8e1e8");
                    skyGrad.addColorStop(0.7, "#bcc7d1");
                    skyGrad.addColorStop(1, "#a4b0ba");
                } else {
                    skyGrad.addColorStop(0, "#020206");      // Deep black night
                    skyGrad.addColorStop(0.4, "#04050d");    // Faint dark navy
                    skyGrad.addColorStop(0.75, "#070814");   // Dark nocturnal haze
                    skyGrad.addColorStop(1, "#0a0c1a");      // Faint horizon tone
                }
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, screenW, screenH);

                // --- 2. FAINT DIGITAL RETICLE / CELESTIAL MOON ---
                ctx.save();
                const moonX = 640 - camera.x * 0.015;
                const moonY = 80 - camera.y * 0.01;
                ctx.translate(moonX, moonY);
                ctx.rotate(this.holoAngle);
                ctx.strokeStyle = isHitstop ? "rgba(20, 25, 35, 0.3)" : "rgba(0, 243, 255, 0.06)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(0, 0, 36, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(0, 0, 24, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                // --- 3. DISTANT CITY PANORAMA IMAGE (LOW CONTRAST, DEEP BACKGROUND) ---
                if (this.imgLoaded && this.img.complete) {
                    ctx.save();
                    const imgParallaxX = -camera.x * 0.03;
                    const imgParallaxY = -camera.y * 0.02;
                    const imgW = screenW * 1.5;
                    const imgH = screenH * 1.05;
                    if (isHitstop) {
                        ctx.filter = "invert(1) contrast(1.1) brightness(0.9)";
                        ctx.globalAlpha = 0.12;
                    } else {
                        ctx.globalAlpha = 0.10;
                    }
                    ctx.drawImage(this.img, imgParallaxX - 60, imgParallaxY - 10, imgW, imgH);
                    ctx.restore();
                }

                // --- 4. DISTANT SKYLINE SILHOUETTE (FAR DISTANCE, SOFT BLEND) ---
                ctx.save();
                const distOffsetCamX = -camera.x * 0.06;
                const distOffsetCamY = -camera.y * 0.04;
                const distBaseY = screenH + 20 + distOffsetCamY;

                for (const s of this.distantSpires) {
                    const sx = s.x + distOffsetCamX;
                    if (sx + s.w < -30 || sx > screenW + 30) continue;

                    // In hitstop: dark charcoal silhouette standing out sharply against bright inverted sky
                    ctx.fillStyle = isHitstop ? "#252b34" : "#070810";
                    ctx.fillRect(sx, distBaseY - s.h, s.w, s.h + 40);

                    // Spire with faint beacon
                    if (s.spireH > 0) {
                        const spireX = sx + s.w / 2;
                        const spireTopY = distBaseY - s.h - s.spireH;
                        ctx.strokeStyle = isHitstop ? "#3a424e" : "#0c0e18";
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.moveTo(spireX, distBaseY - s.h);
                        ctx.lineTo(spireX, spireTopY);
                        ctx.stroke();

                        if (!isHitstop) {
                            const pulse = (Math.sin(this.time * 0.05 + s.beaconOffset) + 1) / 2;
                            if (pulse > 0.45) {
                                ctx.fillStyle = s.beaconColor;
                                ctx.globalAlpha = pulse * 0.6;
                                ctx.beginPath();
                                ctx.arc(spireX, spireTopY, 1.2, 0, Math.PI * 2);
                                ctx.fill();
                                ctx.globalAlpha = 1.0;
                            }
                        } else {
                            ctx.fillStyle = "#ffffff";
                            ctx.beginPath();
                            ctx.arc(spireX, spireTopY, 1.2, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }

                    // Dim pinpoints of distant windows
                    if (!isHitstop) {
                        for (const p of s.pinpoints) {
                            ctx.fillStyle = p.color + p.alpha + ")";
                            ctx.fillRect(sx + p.rx, distBaseY - s.h + p.ry, 2, 1.5);
                        }
                    }
                }
                ctx.restore();

                // --- 5. DISTANT SKY FLYERS (FAR IN HIGH SKY) ---
                if (!isHitstop) {
                    ctx.save();
                    for (const f of this.distantFlyers) {
                        const fx = f.x - camera.x * 0.03;
                        const fy = f.y - camera.y * 0.015;
                        if (fx > -40 && fx < screenW + 40) {
                            ctx.strokeStyle = f.color;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(fx - f.dir * 12, fy);
                            ctx.lineTo(fx, fy);
                            ctx.stroke();
                            ctx.fillStyle = "#ffffff";
                            ctx.fillRect(fx - 1, fy, 2, 1);
                        }
                    }
                    ctx.restore();
                }

                // --- 6. DARK OVERLAY & FOG VEIL ---
                ctx.save();
                if (!isHitstop) {
                    // Dark gradient veil to push background far into the distance
                    const veil = ctx.createLinearGradient(0, 0, 0, screenH);
                    veil.addColorStop(0, "rgba(2, 2, 5, 0.25)");
                    veil.addColorStop(0.5, "rgba(3, 4, 8, 0.5)");
                    veil.addColorStop(0.85, "rgba(4, 5, 10, 0.88)");
                    veil.addColorStop(1, "rgba(4, 5, 10, 0.98)");
                    ctx.fillStyle = veil;
                    ctx.fillRect(0, 0, screenW, screenH);
                } else {
                    // High-key wash in hitstop preserving the bright inverted background
                    const hitstopVeil = ctx.createLinearGradient(0, 0, 0, screenH);
                    hitstopVeil.addColorStop(0, "rgba(255, 255, 255, 0.04)");
                    hitstopVeil.addColorStop(1, "rgba(164, 176, 186, 0.15)");
                    ctx.fillStyle = hitstopVeil;
                    ctx.fillRect(0, 0, screenW, screenH);
                }
                ctx.restore();
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById("game"); this.ctx = this.canvas.getContext("2d");
                this.input = new InputHandler(this.canvas); this.camera = new Camera();
                this.particles = new ParticleSystem(); this.level = new Level();
                this.physics = new PhysicsSystem(this.level); this.renderer = new RenderSystem(this.ctx, this.camera);
                this.ui = new UIManager(); this.bulletManager = new BulletManager();
                this.backdrop = new CyberpunkBackdrop();
                this.freezeFrames = 0;
                this.hitstopFrames = 0; // Initialize hitstop frame counter
                this.targetEnemyCount = 8;
                this.currentWave = 1;
                this.reset();
                this.loop = this.loop.bind(this); requestAnimationFrame(this.loop);
            }
            spawnEnemies(count) {
                this.enemies = [];
                const spawnPoints = [
                    { x: 400, y: 900 }, { x: 600, y: 900 }, { x: 1200, y: 900 },
                    { x: 200, y: 700 }, { x: 900, y: 600 }, { x: 1100, y: 300 },
                    { x: 1600, y: 200 }, { x: 1800, y: 750 }
                ];
                for (let i = 0; i < count; i++) {
                    const point = spawnPoints[i % spawnPoints.length];
                    const offsetX = i >= spawnPoints.length ? Utils.rand(-30, 30) : 0;
                    const offsetY = i >= spawnPoints.length ? Utils.rand(-10, 10) : 0;
                    this.enemies.push(new Enemy(point.x + offsetX, point.y + offsetY));
                }
            }
            adjustEnemyCount() {
                const aliveEnemies = this.enemies.filter(e => !e.isDead);
                const currentAlive = aliveEnemies.length;

                if (currentAlive < this.targetEnemyCount) {
                    const spawnPoints = [
                        { x: 400, y: 900 }, { x: 600, y: 900 }, { x: 1200, y: 900 },
                        { x: 200, y: 700 }, { x: 900, y: 600 }, { x: 1100, y: 300 },
                        { x: 1600, y: 200 }, { x: 1800, y: 750 }
                    ];
                    const needed = this.targetEnemyCount - currentAlive;
                    for (let i = 0; i < needed; i++) {
                        const idx = (this.enemies.length + i) % spawnPoints.length;
                        const point = spawnPoints[idx];
                        const offsetX = Utils.rand(-30, 30);
                        const offsetY = Utils.rand(-10, 10);
                        this.enemies.push(new Enemy(point.x + offsetX, point.y + offsetY));
                    }
                } else if (currentAlive > this.targetEnemyCount) {
                    const excess = currentAlive - this.targetEnemyCount;
                    let removed = 0;
                    for (let i = this.enemies.length - 1; i >= 0; i--) {
                        if (!this.enemies[i].isDead) {
                            this.enemies.splice(i, 1);
                            removed++;
                            if (removed >= excess) break;
                        }
                    }
                }
            }
            reset() {
                this.player = new Player();
                this.currentWave = 1;
                this.spawnEnemies(this.targetEnemyCount);
                this.bulletManager.bullets = [];
                this.healthPackets = [];
                this.ui.init(this.player.wallJumpsMax, this.player.maxDashes);
            }
            get context() { return { input: this.input, camera: this.camera, particles: this.particles, level: this.level, physics: this.physics, bulletManager: this.bulletManager, game: this }; }
            update() {
                if (this.hitstopFrames > 0) {
                    this.hitstopFrames--;
                    this.camera.update(this.player, this.canvas.width, this.canvas.height);
                    this.particles.update();
                    this.ui.update(this.player, this);
                    this.input.clearFrame();
                    return;
                }

                if (this.input.isPressed("n")) {
                    this.targetEnemyCount++;
                    if (this.targetEnemyCount > 50) this.targetEnemyCount = 50;
                    this.adjustEnemyCount();
                }
                if (this.input.isPressed("m")) {
                    this.targetEnemyCount--;
                    if (this.targetEnemyCount < 1) this.targetEnemyCount = 1;
                    this.adjustEnemyCount();
                }

                this.camera.update(this.player, this.canvas.width, this.canvas.height);
                this.backdrop.update();
                this.particles.update();
                this.player.update(this.context);
                for (let i = this.enemies.length - 1; i >= 0; i--) { const e = this.enemies[i]; e.update(this.context); if (e.markedForDeletion) this.enemies.splice(i, 1); }
                for (let i = this.healthPackets.length - 1; i >= 0; i--) { const hp = this.healthPackets[i]; hp.update(this.context); if (hp.markedForDeletion) this.healthPackets.splice(i, 1); }
                this.bulletManager.update(this.context);

                const allEntities = [this.player, ...this.enemies];
                this.physics.resolveEntitySeparation(allEntities);

                if (this.enemies.length === 0) {
                    this.currentWave++;
                    this.spawnEnemies(this.targetEnemyCount);
                    const banner = document.getElementById("wave-banner");
                    if (banner) {
                        banner.textContent = `Wave ${this.currentWave}`;
                        banner.classList.add("show");
                        setTimeout(() => {
                            banner.classList.remove("show");
                        }, 2000);
                    }
                }

                this.ui.update(this.player, this);
                this.input.clearFrame();
            }
            draw() {
                const isHitstop = this.hitstopFrames > 0;
                this.renderer.clear(this.canvas.width, this.canvas.height, isHitstop);
                this.backdrop.draw(this.ctx, this.camera, this.canvas.width, this.canvas.height, isHitstop);
                this.renderer.begin();
                this.renderer.drawLevel(this.level, isHitstop);
                this.player.shrine.draw(this.ctx);
                this.particles.draw(this.ctx);
                this.healthPackets.forEach((hp) => hp.draw(this.ctx));
                this.enemies.forEach((e) => this.renderer.drawEntity(e, { x: this.player.x + this.player.width / 2, y: this.player.y + this.player.height / 2 }, isHitstop));
                this.renderer.drawEntity(this.player, { x: this.input.mouse.x + this.camera.x, y: this.input.mouse.y + this.camera.y }, isHitstop);
                this.bulletManager.draw(this.renderer);
                this.renderer.end();
                this.renderer.drawCursor(this.input.mouse);
            }
            loop() {
                if (this.freezeFrames > 0) { this.freezeFrames--; requestAnimationFrame(this.loop); return; }
                this.update(); this.draw(); requestAnimationFrame(this.loop);
            }
        }

        const game = new Game();
    </script>
